name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests & audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, redis
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit de sécurité des dépendances
        # Échoue sur toute vulnérabilité moyenne ou plus (firebase/php-jwt, faible, via kreait inutilisé)
        run: composer audit --abandoned=ignore --ignore-severity=low

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test
